name: super_selectos
description: "App para buscar productos del Super Selectos"
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  #Icons
  flutter_svg: ^2.3.0

  #UIExpressive
  material_3_expressive: ^1.1.6
  smooth_page_indicator: ^3.0.0
  cached_network_image: ^4.0.4

  #state management
  shared_preferences: ^2.5.5

  #local db
  sqflite: ^2.4.4+2

  #permissions
  permission_handler: ^13.0.2

  #api
  connectivity_plus: ^7.3.2
  http: ^1.6.0
  ota_update: ^7.1.0

  #mobile scanner
  mobile_scanner: ^7.4.2

  #html (para web)
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/shopping_cart_light_green.png"
  min_sdk_android: 21
  adaptive_icon_background: "#013810"
  adaptive_icon_foreground: "assets/shopping_cart_light_green.png"
  adaptive_icon_foreground_inset: 20
  remove_alpha_ios: true
  background_color_ios: "#013810"

flutter:
  uses-material-design: true
  assets:
    - assets/
