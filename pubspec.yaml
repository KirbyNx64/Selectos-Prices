name: super_selectos
description: "App para buscar productos del Super Selectos"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^2.0.0

  #UIExpressive
  material_3_expressive: ^1.1.6
  smooth_page_indicator: ^3.0.0

  #state management
  shared_preferences: ^2.5.5

  #local db
  sqflite: ^2.4.4+2

  #permissions
  permission_handler: ^13.0.2

  #api
  http: ^1.6.0

  #mobile scanner
  mobile_scanner: ^7.4.2
  html: ^0.15.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_full.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/